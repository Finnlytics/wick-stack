name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

jobs:
  # One job per project, run in parallel. The libraries run the full `mix check`
  # (format, credo --strict, compile --warnings-as-errors, test, dialyzer); the demo
  # applications have no `check` alias, so they are driven step by step.
  #
  # Every project is built from the same commit, which is the point of the monorepo:
  # `wick` resolves `wick_coap` through a relative path, so a change spanning both is
  # tested together rather than against whatever `main` happened to be.
  library:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [wick, wick_coap]
        include:
          - elixir: "1.19.5"
            otp: "28.0"

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: ${{ runner.os }}-mix-${{ matrix.project }}-${{ hashFiles(format('{0}/mix.lock', matrix.project)) }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.project }}-

      # The PLT is slow to build and changes only when dependencies or OTP do, so it is
      # cached on its own key.
      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.project }}/priv/plts
          key: ${{ runner.os }}-plt-${{ matrix.project }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles(format('{0}/mix.lock', matrix.project)) }}
          restore-keys: ${{ runner.os }}-plt-${{ matrix.project }}-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get
      - run: mix check

  demo:
    name: demo/${{ matrix.project }}
    runs-on: ubuntu-latest
    # The demos consume both libraries through path dependencies, so there is no point
    # running them if a library is broken.
    needs: library

    strategy:
      fail-fast: false
      matrix:
        project: [wick_demo_server, wick_demo_client]
        include:
          - elixir: "1.19.5"
            otp: "28.0"

    defaults:
      run:
        working-directory: demo/${{ matrix.project }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: |
            demo/${{ matrix.project }}/deps
            demo/${{ matrix.project }}/_build
          key: ${{ runner.os }}-mix-demo-${{ matrix.project }}-${{ hashFiles(format('demo/{0}/mix.lock', matrix.project)) }}
          restore-keys: ${{ runner.os }}-mix-demo-${{ matrix.project }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix compile --warnings-as-errors
      - run: mix test
